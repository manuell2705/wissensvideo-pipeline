name: Flux2 reference test
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python render/flux2_test.py ft
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "flux2-test-${{ github.run_number }}" ft/* -R ${{ github.repository }} --title "Flux2 test" --notes "reference consistency"
