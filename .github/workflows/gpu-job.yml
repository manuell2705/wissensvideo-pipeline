name: GPU job (RunPod)
# Starts a GPU pod, runs TASK_CMD on it, uploads gpu_out/ as a release, and ALWAYS deletes the pod.
on:
  workflow_dispatch:
    inputs:
      task_cmd: { description: 'Command run inside the pod (in repo root, outputs to gpu_out/)', required: true }
      max_minutes: { description: 'Hard time limit', required: false, default: '60' }
      pip_pkgs: { description: 'pip packages for the pod', required: false, default: 'chatterbox-tts kokoro soundfile' }
      gpu: { description: 'small (24 GB, voice), big (48 GB), h100 (80 GB, fastest)', required: false, default: 'small' }
permissions:
  contents: write
jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Start pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TASK_CMD: ${{ inputs.task_cmd }}
          GPU: ${{ inputs.gpu }}
          PIP_PKGS: ${{ inputs.pip_pkgs }}
          MAX_MIN: ${{ inputs.max_minutes }}
        run: |
          TAG="gpu-${{ github.run_id }}"; echo "TAG=$TAG" >> $GITHUB_ENV
          echo "BAL0=$(python3 render/gpu/balance.py || echo ?)" >> $GITHUB_ENV; echo "T0=$(date +%s)" >> $GITHUB_ENV
          python3 render/gpu/start_pod.py
      - name: Wait for result
        env: { GH_TOKEN: '${{ github.token }}', RUNPOD_API_KEY: '${{ secrets.RUNPOD_API_KEY }}' }
        run: |
          for i in $(seq 1 $(( ${{ inputs.max_minutes }} * 2 ))); do
            if gh release view "$TAG" -R ${{ github.repository }} --json assets --jq '.assets[].name' 2>/dev/null | grep -q zz_DONE; then echo "result ready"; gh release view "$TAG" -R ${{ github.repository }}; exit 0; fi
            # pod vanished (bad host / never started)? stop waiting instead of idling until the time limit
            g=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $RUNPOD_API_KEY" "https://api.runpod.io/v2/pods/$POD")
            if [ "$g" = "404" ] && [ $i -gt 2 ]; then echo "::error::pod $POD is gone without a result"; exit 1; fi
            sleep 30
          done
          echo "time limit reached"; exit 1
      - name: Always delete pod
        if: always()
        env: { RUNPOD_API_KEY: '${{ secrets.RUNPOD_API_KEY }}' }
        run: |
          [ -z "$POD" ] && exit 0
          for i in 1 2 3 4 5; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $RUNPOD_API_KEY" "https://api.runpod.io/v2/pods/$POD"); echo "delete $POD -> $c"
            g=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $RUNPOD_API_KEY" "https://api.runpod.io/v2/pods/$POD"); echo "check -> $g"
            [ "$g" = "404" ] && echo "pod gone" && exit 0; sleep 10
          done
          echo "::error::pod $POD may still exist"; exit 1
      - name: Cost report
        if: always()
        env: { RUNPOD_API_KEY: '${{ secrets.RUNPOD_API_KEY }}' }
        run: |
          sleep 60   # RunPod books the last minutes with a short delay
          B1=$(python3 render/gpu/balance.py || echo ?); MIN=$(( ($(date +%s) - ${T0:-$(date +%s)}) / 60 ))
          echo "COST_REPORT pod=$POD minutes=$MIN balance_before=$BAL0 balance_after=$B1 spent=$(python3 -c "print(round($BAL0-$B1,2))" 2>/dev/null || echo ?)" | tee -a $GITHUB_STEP_SUMMARY
