name: GPU job (RunPod)
# Starts a GPU pod, runs TASK_CMD on it, uploads gpu_out/ as a release, and ALWAYS deletes the pod.
on:
  workflow_dispatch:
    inputs:
      task_cmd: { description: 'Command run inside the pod (in repo root, outputs to gpu_out/)', required: true }
      max_minutes: { description: 'Hard time limit', required: false, default: '60' }
      pip_pkgs: { description: 'pip packages for the pod', required: false, default: 'chatterbox-tts kokoro soundfile' }
      gpu: { description: 'small (24 GB, voice) or big (48 GB, images)', required: false, default: 'small' }
permissions:
  contents: write
jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Start pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TASK_CMD: ${{ inputs.task_cmd }}
          GPU: ${{ inputs.gpu }}
          PIP_PKGS: ${{ inputs.pip_pkgs }}
        run: |
          TAG="gpu-${{ github.run_id }}"; echo "TAG=$TAG" >> $GITHUB_ENV
          BODY=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "name": "mindsphere-gpu", "imageName": "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04",
            "gpuTypeIds": (["NVIDIA RTX A6000", "NVIDIA L40S", "NVIDIA A40", "NVIDIA RTX 6000 Ada Generation"] if os.environ["GPU"] == "big"
                           else ["NVIDIA GeForce RTX 4090", "NVIDIA RTX A5000", "NVIDIA GeForce RTX 3090", "NVIDIA L4"]),
            "gpuCount": 1, "cloudType": "COMMUNITY", "containerDiskInGb": (200 if os.environ["GPU"] == "big" else 60), "volumeInGb": 0,
            "env": {"RUNPOD_API_KEY": os.environ["RUNPOD_API_KEY"], "GH_TOKEN": os.environ["GH_TOKEN"], "REPO": os.environ["GITHUB_REPOSITORY"],
                    "TASK_CMD": os.environ["TASK_CMD"], "PIP_PKGS": os.environ["PIP_PKGS"], "HF_HUB_ENABLE_HF_TRANSFER": "1", "RESULT_TAG": "gpu-" + os.environ["GITHUB_RUN_ID"]},
            "dockerStartCmd": ["bash", "-c", "curl -sL https://raw.githubusercontent.com/" + os.environ["GITHUB_REPOSITORY"] + "/main/render/gpu/pod_job.sh | bash"]}))
          PY
          )
          R=$(curl -s -X POST https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" -H 'Content-Type: application/json' -d "$BODY")
          echo "$R" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k: d.get(k) for k in ('id','desiredStatus','costPerHr','gpu','machine','error')})"
          POD=$(echo "$R" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          [ -n "$POD" ] || exit 1
          echo "POD=$POD" >> $GITHUB_ENV
      - name: Wait for result
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for i in $(seq 1 $(( ${{ inputs.max_minutes }} * 2 ))); do
            if gh release view "$TAG" -R ${{ github.repository }} --json assets --jq '.assets[].name' 2>/dev/null | grep -q zz_DONE; then echo "result ready"; gh release view "$TAG" -R ${{ github.repository }}; exit 0; fi
            sleep 30
          done
          echo "time limit reached"; exit 1
      - name: Always delete pod
        if: always()
        env: { RUNPOD_API_KEY: '${{ secrets.RUNPOD_API_KEY }}' }
        run: |
          [ -n "$POD" ] && curl -s -X DELETE -H "Authorization: Bearer $RUNPOD_API_KEY" "https://rest.runpod.io/v1/pods/$POD"; echo deleted $POD
