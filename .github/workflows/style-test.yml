name: Style test
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python render/style_test.py st
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "style-test-${{ github.run_number }}" st/* --title "Style test" --notes "New Mindsphere look"
