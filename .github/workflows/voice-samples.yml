name: Voice samples
on:
  workflow_dispatch:
    inputs:
      script: { description: 'voice_samples.py or voice_variants.py', required: false, default: 'voice_variants.py' }
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r render/requirements.txt edge-tts
      - run: python render/${{ inputs.script }} samples
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "voice-samples-${{ github.run_number }}" samples/*.mp3 --title "Voice samples (${{ inputs.script }})" --notes "Compare and pick one"
