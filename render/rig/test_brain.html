<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0b1d3f; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; font-family: Fredoka, Inter, sans-serif; }
  svg { position: absolute; inset: 0; }
  .chip { position: absolute; left: 1390px; white-space: nowrap; bottom: 90px; padding: 18px 34px; border-radius: 999px; font-size: 40px; font-weight: 700; color: #fff;
          background: rgba(10, 30, 60, .55); border: 2px solid rgba(140, 230, 220, .55); backdrop-filter: blur(8px); opacity: 0; letter-spacing: .5px;
          box-shadow: 0 10px 40px rgba(0, 0, 0, .35); }
  .chip b { color: #ffb547; }
</style></head>
<body><div id="stage"><svg id="svg" viewBox="0 0 1920 1080"></svg></div>
<script src="../vendor/gsap.min.js"></script>
<script src="characters.js"></script>
<script>
const svg = document.getElementById('svg'), stage = document.getElementById('stage');
const tl = gsap.timeline({ paused: true });
window.seek = t => { tl.seek(t, false); };
const defs = E('defs', {}, svg);
const lg = E('linearGradient', { id: 'sky', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
E('stop', { offset: 0, 'stop-color': '#0a1b3d' }, lg); E('stop', { offset: .65, 'stop-color': '#123f66' }, lg); E('stop', { offset: 1, 'stop-color': '#16575f' }, lg);
const glow = E('filter', { id: 'glow', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
E('feGaussianBlur', { stdDeviation: 10, result: 'b' }, glow); const fm = E('feMerge', {}, glow); E('feMergeNode', { in: 'b' }, fm); E('feMergeNode', { in: 'SourceGraphic' }, fm);

// ---------- calm vector world ----------
E('rect', { width: 1920, height: 1080, fill: 'url(#sky)' }, svg);
const stars = G(svg); for (let i = 0; i < 60; i++) E('circle', { cx: (i * 397) % 1920, cy: (i * 151) % 560, r: 1 + (i % 3), fill: '#cfe9ff', opacity: .25 + (i % 5) * .1 }, stars);
const cam = G(svg);   // camera group: everything that zooms together
E('path', { d: 'M0,760 C300,690 600,720 900,700 C1250,676 1600,720 1920,690 L1920,1080 L0,1080 Z', fill: '#134a55' }, cam);
E('path', { d: 'M0,840 C400,800 800,830 1200,812 C1500,800 1750,820 1920,808 L1920,1080 L0,1080 Z', fill: '#185e5e' }, cam);
E('ellipse', { cx: 560, cy: 995, rx: 210, ry: 26, fill: '#0b2c33', opacity: .55 }, cam);   // contact shadow
// glass board
const board = G(cam, { opacity: 0 });
E('rect', { x: 980, y: 140, width: 840, height: 720, rx: 44, fill: 'rgba(200,245,255,.07)', stroke: 'rgba(140,230,220,.55)', 'stroke-width': 3 }, board);
E('rect', { x: 1000, y: 160, width: 800, height: 40, rx: 20, fill: 'rgba(255,255,255,.06)' }, board);

// ---------- brain diagram (side view) ----------
const brain = G(board, { transform: 'translate(1100,300)' });
const outline = 'M110,300 C70,270 60,200 90,150 C120,80 200,40 300,40 C400,35 500,70 545,150 C575,205 565,270 520,300 C490,320 450,325 420,318 C380,330 330,335 290,330 C230,340 160,335 110,300 Z';
const cp = E('clipPath', { id: 'bclip' }, defs); E('path', { d: outline }, cp);
E('path', { d: 'M380,318 C390,360 392,400 398,450 L432,450 C426,400 424,360 424,318 Z', fill: '#2a4a68', stroke: '#9fdfe0', 'stroke-width': 4 }, brain);   // stem
const cereb = G(brain); E('ellipse', { cx: 458, cy: 330, rx: 74, ry: 42, fill: '#2a4a68', stroke: '#9fdfe0', 'stroke-width': 4 }, cereb);
for (let i = 0; i < 4; i++) E('path', { d: `M${400 + i * 6},${314 + i * 10} C430,${306 + i * 10} 490,${306 + i * 10} 526,${316 + i * 10}`, stroke: 'rgba(255,255,255,.3)', 'stroke-width': 3, fill: 'none' }, cereb);
const cerebLit = E('ellipse', { cx: 458, cy: 330, rx: 74, ry: 42, fill: '#ff8fb1', opacity: 0, filter: 'url(#glow)' }, brain);
const regionsG = G(brain, { 'clip-path': 'url(#bclip)' });
E('path', { d: outline, fill: '#22415f' }, regionsG);
const R = {
  frontal:   ['M0,0 L270,0 C255,120 240,200 230,260 L0,360 Z', '#3fe0d0'],
  parietal:  ['M270,0 L470,0 C455,90 430,150 400,190 C330,180 280,178 240,205 C250,130 260,70 270,0 Z', '#ffb547'],
  occipital: ['M470,0 L640,0 L640,360 L470,320 C458,250 432,205 400,190 C430,150 455,90 470,0 Z', '#7ee081'],
  temporal:  ['M230,260 C240,205 280,178 400,190 C432,205 458,250 470,320 L470,380 L160,380 Z', '#8fa8ff'],
};
const lit = {};
for (const k in R) { E('path', { d: R[k][0], fill: 'none', stroke: 'rgba(160,220,230,.35)', 'stroke-width': 3 }, regionsG);
  lit[k] = E('path', { d: R[k][0], fill: R[k][1], opacity: 0 }, regionsG); }
for (const d of ['M130,200 C160,170 190,190 210,160', 'M150,260 C190,240 220,270 250,240', 'M300,90 C330,110 360,80 390,100', 'M420,120 C440,150 470,130 500,160',
                 'M320,250 C350,230 380,260 420,240', 'M110,150 C140,130 160,110 200,110', 'M480,220 C500,240 520,220 540,240'])
  E('path', { d, stroke: 'rgba(255,255,255,.28)', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, regionsG);
E('path', { d: outline, fill: 'none', stroke: '#bff3f0', 'stroke-width': 6 }, brain);
lit.cereb = cerebLit;

// day arc: the sun travels across and turns into the moon ("over a single day")
const day = G(board, { opacity: 0 });
E('path', { d: 'M1110,300 C1200,170 1600,170 1690,300', stroke: 'rgba(255,255,255,.35)', 'stroke-width': 4, fill: 'none', 'stroke-dasharray': '10 12' }, day);
const sun = E('circle', { cx: 1110, cy: 300, r: 26, fill: '#ffd36b', filter: 'url(#glow)' }, day);
const dayP = { p: 0 };
const placeSun = () => { const p = dayP.p, x = 1110 + 580 * p, y = 300 - 4 * 130 * p * (1 - p) * 1.0 - 0;
  sun.setAttribute('cx', x); sun.setAttribute('cy', y); sun.setAttribute('fill', p < .5 ? '#ffd36b' : '#dfe9ff'); };

// neurons: only a few fire at any moment
const neur = G(board, { opacity: 0 });
const nodes = []; let sd = 7; const rnd = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) nodes.push([1070 + c * 130 + (rnd() - .5) * 80, 230 + r * 125 + (rnd() - .5) * 70]);
for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) { const [a, b] = [nodes[i], nodes[j]];
  if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 175) E('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: 'rgba(150,220,230,.28)', 'stroke-width': 3 }, neur); }
const nd = nodes.map(([x, y]) => E('circle', { cx: x, cy: y, r: 13, fill: '#2f5f7a', stroke: '#9fdfe0', 'stroke-width': 3 }, neur));
const sparks = [3, 11, 22].map(i => E('circle', { cx: nodes[i][0], cy: nodes[i][1], r: 15, fill: '#ffe08a', opacity: 0, filter: 'url(#glow)' }, neur));
const check = E('path', { d: 'M1600,760 L1640,800 L1720,710', stroke: '#7ee081', 'stroke-width': 18, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0, filter: 'url(#glow)' }, board);

// weight + energy
const T = (p, x, y, s, txt, fill = '#fff', w = 800) => { const e = E('text', { x, y, 'font-size': s, 'font-weight': w, fill, 'text-anchor': 'middle', 'font-family': 'Fredoka, Inter, sans-serif' }, p); e.textContent = txt; return e; };
const wgt = G(board, { opacity: 0 });
// friendly body pictogram (no x-ray, no face details)
E('circle', { cx: 1200, cy: 330, r: 52, fill: '#5fb0b8' }, wgt);
E('path', { d: 'M1130,560 C1130,440 1160,400 1200,400 C1240,400 1270,440 1270,560 Z', fill: '#5fb0b8' }, wgt);
E('rect', { x: 1150, y: 560, width: 40, height: 170, rx: 18, fill: '#5fb0b8' }, wgt); E('rect', { x: 1210, y: 560, width: 40, height: 170, rx: 18, fill: '#5fb0b8' }, wgt);
const miniBrain = E('path', { d: 'M1185,318 C1170,300 1190,282 1205,290 C1222,280 1236,300 1226,316 C1232,334 1206,342 1200,332 C1188,340 1172,330 1185,318 Z', fill: '#ff8fb1', stroke: '#fff', 'stroke-width': 3 }, wgt);
const pct2 = T(wgt, 1520, 470, 190, '0%', '#ffb547'); T(wgt, 1520, 550, 46, 'of your body weight', '#dff6ff', 600);
const nrg = G(board, { opacity: 0 });
E('rect', { x: 1110, y: 640, width: 560, height: 130, rx: 24, fill: 'none', stroke: '#dff6ff', 'stroke-width': 8 }, nrg);
E('rect', { x: 1676, y: 680, width: 22, height: 50, rx: 6, fill: '#dff6ff' }, nrg);
const cells = [0, 1, 2, 3, 4].map(i => E('rect', { x: 1126 + i * 108, y: 656, width: 96, height: 98, rx: 14, fill: '#7ee081' }, nrg));
const pct20 = T(nrg, 1520, 470, 190, '20%', '#ffb547'); gsap.set(pct20, { opacity: 0 });
const flow = E('path', { d: 'M1180,650 C1180,560 1200,470 1200,350', stroke: '#ffb547', 'stroke-width': 10, fill: 'none', 'stroke-dasharray': '18 16', opacity: 0, filter: 'url(#glow)' }, nrg);
const bolt = E('path', { d: 'M1420,600 L1380,700 L1420,700 L1390,790', stroke: '#ff5a5a', 'stroke-width': 12, fill: 'none', 'stroke-linejoin': 'round', opacity: 0, filter: 'url(#glow)' }, nrg);

// ---------- the 'you' figure ----------
const you = Person(cam, { x: -260, y: 990, s: 0.95 });

// ---------- George's word timings (from the voice track) ----------
const WORDS = {"8": [["Here's", 0.0], ["the", 0.28], ["truth.", 0.44], ["You", 1.84], ["already", 2.12], ["use", 2.6], ["all", 3.26], ["of", 3.64], ["it.", 3.8], ["Brain", 5.14], ["scans", 5.14], ["show", 5.5], ["that", 6.22], ["over", 6.82], ["a", 7.1], ["single", 7.3], ["day,", 7.56], ["practically", 8.62], ["every", 8.94], ["region", 9.5], ["gets", 9.98], ["busy.", 10.28]], "9": [["just", 0.0], ["not", 0.24], ["all", 0.64], ["at", 1.14], ["the", 1.54], ["same", 1.72], ["time.", 2.0], ["At", 3.16], ["any", 3.28], ["moment,", 3.54], ["only", 4.38], ["a", 4.78], ["small", 5.0], ["fraction", 5.36], ["of", 5.9], ["your", 6.08], ["neurons", 6.24], ["is", 6.74], ["firing,", 7.06], ["and", 7.9], ["that's", 8.22], ["on", 8.88], ["purpose.", 9.3]], "10": [["Your", 0.0], ["brain", 0.4], ["is", 0.82], ["about", 1.08], ["2", 1.36], ["%", 1.74], ["of", 2.14], ["your", 2.42], ["body", 2.56], ["weight,", 2.9], ["yet", 3.72], ["it", 4.04], ["uses", 4.66], ["around", 5.1], ["20", 5.52], ["%", 6.12], ["of", 6.4], ["your", 7.0], ["energy.", 7.24], ["Turning", 8.12], ["everything", 8.52], ["on", 9.4], ["would", 9.74], ["need", 10.34], ["far", 10.7], ["more", 11.12], ["power", 11.46], ["than", 11.96], ["your", 12.5], ["body", 12.72], ["can", 13.12], ["deliver.", 13.4]]};
const OFF = { 8: 0.5, 9: 11.82, 10: 22.36 }, END = 37.2;
const W = (s, i) => OFF[s] + WORDS[s][i][1];          // absolute time of word i in scene s
const o8 = OFF[8], o9 = OFF[9], o10 = OFF[10];

// board content groups slide like presentation pages (out left, in from right)
const brainBox = G(board); brainBox.appendChild(brain); brainBox.appendChild(day);
const slide = (from, to, t) => {
  tl.to(from, { x: -160, opacity: 0, duration: 0.6, ease: 'power3.in' }, t);
  tl.fromTo(to, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: 'power3.out', immediateRender: false }, t + 0.35);
};

// ---------- captions: the narrated words appear exactly when George says them ----------
const cap = (s, a, b, hi, tEnd) => {
  const d = document.createElement('div'); d.className = 'chip'; stage.appendChild(d); gsap.set(d, { xPercent: -50 });
  const spans = [];
  for (let i = a; i <= b; i++) {
    const w = WORDS[s][i][0].replace(/[.,]/g, '');
    if (w === '%') { spans[spans.length - 1].textContent += '%'; continue; }
    const sp = document.createElement(hi.includes(i) ? 'b' : 'span'); sp.textContent = w; sp.style.display = 'inline-block'; sp.style.opacity = 0;
    if (spans.length) d.appendChild(document.createTextNode(' '));
    d.appendChild(sp); spans.push(sp);
    tl.fromTo(sp, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.28, ease: 'power2.out', immediateRender: false }, W(s, i) - 0.04);
  }
  tl.fromTo(d, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, W(s, a) - 0.08);
  tl.to(d, { opacity: 0, y: -16, duration: 0.3, ease: 'power2.in' }, tEnd);
};

E('path', { d: 'M1185,318 C1170,300 1190,282 1205,290 C1222,280 1236,300 1226,316 C1232,334 1206,342 1200,332 C1188,340 1172,330 1185,318 Z', fill: '#ff8fb1', stroke: '#fff', 'stroke-width': 3 }, nrg);   // the brain the energy flows to
// brain-scan sweep line
const scan = E('rect', { x: 1080, y: 300, width: 10, height: 480, rx: 5, fill: '#bff3f0', opacity: 0, filter: 'url(#glow)' }, brainBox);
// neuron signals travel along the connections
const nb = nodes.map((a, i) => nodes.map((b, j) => j).filter(j => j !== i && Math.hypot(a[0] - nodes[j][0], a[1] - nodes[j][1]) < 175));
const sig = [0, 1, 2].map(() => E('circle', { r: 11, fill: '#ffe08a', opacity: 0, filter: 'url(#glow)' }, neur));
const pulse = (k, i, j, t) => {
  tl.fromTo(sig[k], { attr: { cx: nodes[i][0], cy: nodes[i][1] }, opacity: 1 }, { attr: { cx: nodes[j][0], cy: nodes[j][1] }, duration: 0.42, ease: 'sine.inOut', immediateRender: false }, t);
  tl.fromTo(nd[j], { attr: { fill: '#2f5f7a', r: 13 } }, { attr: { fill: '#ffd36b', r: 18 }, duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, t + 0.38);
};

// ---------- the timeline ----------
you.idle(tl, 0, END);
tl.to(board, { opacity: 1, duration: 0.8, ease: 'sine.out' }, 0.2);
tl.fromTo(cam, { scale: 1, x: 0, y: 0 }, { scale: 1.04, x: -30, y: -18, duration: W(9, 7) - 0.6, ease: 'sine.inOut' }, 0);   // slow drift, never fully still
you.walkIn(tl, 0, -260, 560, 1.2);

// scene 8 -- "Here's the truth. You already use all of it."
you.pose(tl, W(8, 2) + 0.45, 'pointUp'); you.look(tl, W(8, 2), 0, -4); you.beat(tl, W(8, 2) + 0.45);
you.pose(tl, W(8, 6), 'open'); you.face(tl, W(8, 6) - 0.1, 'grin'); you.beat(tl, W(8, 6), 1.3);
tl.to(Object.values(lit), { opacity: .95, duration: .3, stagger: .06, ease: 'power2.out' }, W(8, 6) - 0.05);
cap(8, 3, 8, [6], W(8, 9) - 0.25);
// "Brain scans show that over a single day ..."
tl.to(Object.values(lit), { opacity: 0, duration: .5 }, W(8, 9) - 0.4);
you.pose(tl, W(8, 9), 'point'); you.face(tl, W(8, 9), 'smile'); you.look(tl, W(8, 9), 8, 0);
tl.fromTo(scan, { opacity: 0, x: 0 }, { opacity: .9, duration: .2, immediateRender: false }, W(8, 9));
tl.to(scan, { x: 620, duration: 1.1, ease: 'sine.inOut' }, W(8, 9));
tl.to(scan, { opacity: 0, duration: .25 }, W(8, 9) + 1.0);
tl.to(day, { opacity: 1, duration: .5 }, W(8, 13) - 0.3);
tl.to(dayP, { p: 1, duration: W(8, 16) + 0.6 - W(8, 15), ease: 'sine.inOut', onUpdate: placeSun }, W(8, 15));
// "... practically every region gets busy."
['frontal', 'parietal', 'occipital', 'temporal', 'cereb'].forEach((k, i) => tl.to(lit[k], { opacity: .9, duration: .3, ease: 'power2.out' }, W(8, 17 + i)));
you.beat(tl, W(8, 18)); you.face(tl, W(8, 21), 'grin'); you.pose(tl, W(8, 21), 'nod');
tl.to(day, { opacity: 0, duration: .5 }, W(8, 21) + 0.3);
cap(8, 17, 21, [18, 19], o9 - 0.15);

// scene 9 -- "just not all at the same time."
you.pose(tl, W(9, 1), 'wag'); you.face(tl, W(9, 1), 'smile'); you.look(tl, W(9, 1), 0, 0);
tl.to(Object.values(lit), { opacity: 0, duration: .35 }, W(9, 1));
['frontal', 'occipital', 'temporal'].forEach((k, i) => { tl.to(lit[k], { opacity: .9, duration: .2 }, W(9, 4 + i)); tl.to(lit[k], { opacity: 0, duration: .25 }, W(9, 4 + i) + 0.35); });
you.pose(tl, W(9, 5), 'shake');
cap(9, 0, 6, [5, 6], W(9, 7) - 0.2);
// "At any moment, only a small fraction of your neurons is firing ..."
slide(brainBox, neur, W(9, 7) - 0.5);
tl.to(cam, { scale: 1.08, x: -100, y: -50, duration: 1.4, ease: 'power2.inOut' }, W(9, 7) - 0.5);
you.pose(tl, W(9, 8), 'point'); you.look(tl, W(9, 8), 8, -2);
you.pose(tl, W(9, 12), 'pinch'); you.face(tl, W(9, 12), 'o'); you.look(tl, W(9, 12), 8, -3); you.beat(tl, W(9, 13));
const chains = [[3, 9, 10, 16, 15, 21], [13, 14, 20, 26, 27], [7, 8, 2, 1]];
let ti = W(9, 10);
for (let step = 0; ti < W(9, 21); step++, ti += 0.33) { const k = step % 3, c = chains[k], n = Math.floor(step / 3) % (c.length - 1); pulse(k, c[n], c[n + 1], ti); }
tl.to(sig, { opacity: 0, duration: .3 }, W(9, 21));
you.beat(tl, W(9, 18));
cap(9, 10, 13, [12, 13], W(9, 19));
// "... and that's on purpose."
you.pose(tl, W(9, 22), 'thumbs'); you.face(tl, W(9, 22) - 0.1, 'grin');
tl.fromTo(check, { opacity: 0, scale: .4, svgOrigin: '1660 755' }, { opacity: 1, scale: 1, duration: .45, ease: 'back.out(2.2)', immediateRender: false }, W(9, 22));
cap(9, 20, 22, [22], o10 - 0.35);

// scene 10 -- "Your brain is about 2% of your body weight,"
tl.to(cam, { scale: 1.03, x: -20, y: -10, duration: 1.3, ease: 'power2.inOut' }, o10 - 0.7);
tl.to(check, { opacity: 0, duration: .3 }, o10 - 0.6);
slide(neur, wgt, o10 - 0.6);
you.pose(tl, W(10, 1), 'chest'); you.face(tl, W(10, 1), 'smile'); you.look(tl, W(10, 1), 0, 4);
tl.fromTo(miniBrain, { scale: 1, svgOrigin: '1203 312' }, { scale: 1.5, duration: .25, yoyo: true, repeat: 1, ease: 'sine.inOut', immediateRender: false }, W(10, 1));
const c2 = { v: 0 }; tl.to(c2, { v: 2, duration: W(10, 5) + 0.2 - W(10, 4), ease: 'power1.out', onUpdate: () => { pct2.textContent = Math.round(c2.v) + '%'; } }, W(10, 4));
you.beat(tl, W(10, 4), 1.2); you.look(tl, W(10, 4), 8, 0);
cap(10, 4, 9, [4, 5], W(10, 10) - 0.15);
// "yet it uses around 20% of your energy."
slide(wgt, nrg, W(10, 10) - 0.35);
you.pose(tl, W(10, 12), 'point'); you.look(tl, W(10, 12), 8, 0);
const c20 = { v: 0 }; pct20.textContent = '0%';
tl.to(pct20, { opacity: 1, duration: .3 }, W(10, 14) - 0.1);
tl.to(c20, { v: 20, duration: W(10, 15) + 0.3 - W(10, 14), ease: 'power1.out', onUpdate: () => { pct20.textContent = Math.round(c20.v) + '%'; } }, W(10, 14));
tl.to(cells[0], { attr: { fill: '#ffb547' }, duration: .3 }, W(10, 14));
tl.fromTo(flow, { opacity: 0, strokeDashoffset: 0 }, { opacity: 1, strokeDashoffset: -170, duration: W(10, 19) - W(10, 14), ease: 'none', immediateRender: false }, W(10, 14));
you.face(tl, W(10, 14), 'o'); you.beat(tl, W(10, 14), 1.2); you.pose(tl, W(10, 18), 'nod');
cap(10, 14, 18, [14, 15], W(10, 19) - 0.15);
// "Turning everything on would need far more power than your body can deliver."
tl.to([flow, pct20], { opacity: 0, duration: .3 }, W(10, 19) - 0.1);
tl.to(cam, { scale: 1.1, x: -150, y: -110, duration: 1.6, ease: 'power2.inOut' }, W(10, 19));
you.pose(tl, W(10, 20), 'open'); you.face(tl, W(10, 20), 'grin');
tl.to(cells, { attr: { fill: '#ffb547' }, duration: .25, stagger: (W(10, 21) - W(10, 19)) / 5 }, W(10, 19));
tl.to(cells, { attr: { fill: '#ff5a5a' }, duration: .25, stagger: .08 }, W(10, 24));
tl.fromTo(bolt, { opacity: 0 }, { opacity: 1, duration: .08, yoyo: true, repeat: 9, immediateRender: false }, W(10, 26));
tl.to(cells, { opacity: .3, duration: .16, yoyo: true, repeat: 9, ease: 'sine.inOut' }, W(10, 26));
you.face(tl, W(10, 27), 'worry'); you.pose(tl, W(10, 30), 'shrug'); you.sweatDrop(tl, W(10, 31));
cap(10, 24, 31, [26, 30, 31], END - 0.35);
tl.to(svg, { opacity: 1, duration: .01 }, END);
window.DURATION = END;
tl.seek(0);
</script></body></html>
