<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --night: #0b1e3f; --deep: #123d7a; --sky: #7fd3ff; --teal: #3fe0d0; --leaf: #8fe35a; --amber: #ffb547; --ink: #ffffff; --navy: #0d2a52;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--night); }
  body { font-family: 'Fredoka', 'Nunito', 'DejaVu Sans', sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .bg { position: absolute; inset: -6%; background-size: cover; background-position: center; will-change: transform; }
  .bg.placeholder { background: radial-gradient(circle at 50% 40%, #1d6f8f, #123d7a 45%, #0b1e3f 80%); }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(5,15,40,.28) 100%); }
  .dark { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(11,30,63,.55), rgba(6,16,36,.82)); opacity: 0; }
  .particles { position: absolute; inset: 0; pointer-events: none; }
  /* soft light motes (fireflies), no bubbles */
  .p { position: absolute; border-radius: 50%; background: rgba(255,250,225,.9); box-shadow: 0 0 10px 3px rgba(255,214,140,.55); }
  /* glass panel shared by all overlays: Mindsphere's 40% Frutiger Aero */
  .glass { background: linear-gradient(160deg, rgba(255,255,255,.28), rgba(90,170,220,.18) 40%, rgba(11,30,63,.62));
     border: 2px solid rgba(255,255,255,.65); border-radius: calc(var(--u) * 2.2);
     box-shadow: 0 10px 34px rgba(5,15,40,.45), inset 0 1px 0 rgba(255,255,255,.7), 0 0 26px rgba(63,224,208,.25);
     backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .ring { position: absolute; border: 3px solid rgba(143,227,90,.85); border-radius: 50%; box-shadow: 0 0 18px rgba(143,227,90,.6); }
  .title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; padding: calc(var(--u)*3.2) calc(var(--u)*5); max-width: 86%; }
  .title .ch { display: inline-block; margin: 0 .14em; font-weight: 700; font-size: calc(var(--u) * 6.8); line-height: 1.12; text-shadow: 0 3px 18px rgba(5,15,40,.6); }
  .title .ch.hl { color: var(--amber); }
  .title .ring { left: 50%; top: 50%; width: 120%; height: 34%; margin-left: -60%; margin-top: -17%; transform: rotate(-8deg); }
  .chapter { position: absolute; left: 6%; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: calc(var(--u)*2.4); padding: calc(var(--u)*2.2) calc(var(--u)*3.6) calc(var(--u)*2.2) calc(var(--u)*2.2); max-width: 82%; }
  .chapter .no { flex: none; width: calc(var(--u)*11); height: calc(var(--u)*11); border-radius: 50%; display: grid; place-items: center;
     font-weight: 700; font-size: calc(var(--u)*6); color: var(--navy);
     background: radial-gradient(circle at 35% 30%, #fff, #c8ffd9 35%, #8fe35a 70%, #3aa34a); box-shadow: 0 0 24px rgba(143,227,90,.6); position: relative; }
  .chapter .no .ring { inset: -18%; border-width: 2px; transform: rotateX(70deg); }
  .chapter .txt { font-weight: 700; font-size: calc(var(--u) * 5.6); line-height: 1.1; text-shadow: 0 3px 14px rgba(5,15,40,.55); }
  .num { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; padding: calc(var(--u)*2.6) calc(var(--u)*5); max-width: 88%; }
  .num .v { font-weight: 700; font-size: calc(var(--u) * 8.4); line-height: 1.05; color: var(--amber); text-shadow: 0 0 30px rgba(255,181,71,.45), 0 4px 0 rgba(13,42,82,.5); }
  .num .bar { height: calc(var(--u)*.6); margin: calc(var(--u)*1.6) auto 0; width: 60%; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--leaf)); transform-origin: left; }
  .cards { position: absolute; left: 4%; bottom: 7%; display: flex; flex-wrap: wrap; gap: calc(var(--u)*1.4); max-width: 70%; }
  .card { display: flex; align-items: center; gap: calc(var(--u)*1.1); padding: calc(var(--u)*1.0) calc(var(--u)*2.2) calc(var(--u)*1.0) calc(var(--u)*1.3); border-radius: 99px;
     font-weight: 600; font-size: calc(var(--u) * 3.0); text-shadow: 0 2px 6px rgba(5,15,40,.6); white-space: nowrap; }
  .card .dot { width: calc(var(--u)*1.5); height: calc(var(--u)*1.5); border-radius: 50%; background: var(--leaf); box-shadow: 0 0 12px var(--leaf); flex: none; }
  .card:nth-child(2) .dot { background: var(--teal); box-shadow: 0 0 12px var(--teal); }
  .card:nth-child(3) .dot { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
  .portrait .cards { left: 50%; bottom: auto; top: 12%; transform: translateX(-50%); justify-content: center; max-width: 90%; }
  .portrait .card { font-size: calc(var(--u) * 4.4); }
  .cap { position: absolute; left: 6%; right: 6%; bottom: 20%; text-align: center; font-weight: 700; font-size: calc(var(--u) * 7.4);
     line-height: 1.15; text-shadow: 0 0 6px #000, 0 6px 0 rgba(0,0,0,.6); -webkit-text-stroke: 4px var(--navy); paint-order: stroke fill; }
  .cap .w { display: inline-block; margin: 0 .12em; opacity: 0; }
  .cap .w.hot { color: var(--amber); }
  /* anime motion pass */
  .shots { position: absolute; inset: 0; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .line, .paper { position: absolute; inset: -6%; background-size: cover; background-position: center; }
  .paper { background: #0c1e3f; }
  .speed { position: absolute; left: 50%; top: 50%; width: 260%; height: 260%; margin: -130% 0 0 -130%; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: screen; }
  .leak { position: absolute; width: 70%; height: 90%; border-radius: 50%; filter: blur(60px); mix-blend-mode: screen; opacity: .0; pointer-events: none; }
  .grain { position: absolute; inset: -50%; opacity: .07; pointer-events: none; mix-blend-mode: overlay;
     background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .bars { position: absolute; left: 0; right: 0; height: 7%; background: #050b18; z-index: 5; }
  .brand { position: absolute; right: 3%; top: 4%; font-weight: 700; font-size: calc(var(--u) * 2.0); opacity: .5; letter-spacing: .08em; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="vendor/gsap.min.js"></script>
<script src="data.js"></script>
<script>
// Our motion rules (from the GSAP + LottieFiles motion-design guidance):
// - something always moves (Ken Burns + particles), ease out on entrances, ease in on exits,
// - stagger text, overshoot only on small "pop" elements, transitions 0.5-0.8 s.
const V = window.VIDEO;
const W = V.width, H = V.height;
document.documentElement.style.setProperty('--w', W + 'px');
document.documentElement.style.setProperty('--h', H + 'px');
document.documentElement.style.setProperty('--u', (Math.min(W, H) / 100) + 'px');
if (H > W) document.body.classList.add('portrait');
const stage = document.getElementById('stage');
const tl = gsap.timeline({ paused: true });
// deterministic random
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const XF = 0.6; // crossfade seconds

V.scenes.forEach((s, i) => {
  const el = document.createElement('div'); el.className = 'scene'; stage.appendChild(el);
  el.insertAdjacentHTML('beforeend', '<div class="shots"></div>');
  const shotsBox = el.querySelector('.shots');
  el.insertAdjacentHTML('beforeend', '<div class="shade"></div><div class="dark"></div><div class="particles"></div>');
  const dark = el.querySelector('.dark');
  const t0 = s.start, d = s.dur;
  // scene in/out
  tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: i === 0 ? 0.01 : XF, ease: 'power1.inOut' }, Math.max(0, t0 - (i === 0 ? 0 : XF / 2)));
  tl.set(el, { opacity: 0 }, t0 + d + XF / 2 + 0.05);
  const shots = (s.shots && s.shots.length) ? s.shots : [{ t: t0, d: d, img: s.img, line: null }];
  let bg = null;
  shots.forEach((sh, k) => {
    const wrap = document.createElement('div'); wrap.className = 'shot'; shotsBox.appendChild(wrap);
    const b = document.createElement('div'); b.className = 'bg' + (sh.img ? '' : ' placeholder');
    if (sh.img) b.style.backgroundImage = `url("${sh.img}")`;
    wrap.appendChild(b); if (k === 0) bg = b;
    const st = sh.t, sd = sh.d;
    // camera per shot: Ken Burns with varied direction (+ a slight 3D drift so it never feels like a slideshow)
    const dir = (i + k) % 4;
    const fromS = [1.02, 1.14, 1.05, 1.12][dir], toS = [1.14, 1.02, 1.16, 1.04][dir];
    const fx = [-2, 2, 0, -1.5][dir], tx = [2, -2, 0, 1.5][dir], fy = [0, 0, -2, 1.5][dir], ty = [0, 0, 2, -1.5][dir];
    tl.fromTo(b, { scale: fromS, xPercent: fx, yPercent: fy, rotation: (dir - 1.5) * 0.25 },
                 { scale: toS, xPercent: tx, yPercent: ty, rotation: -(dir - 1.5) * 0.25, duration: sd + XF + 0.3, ease: 'sine.inOut' }, st - XF / 2);
    if (k > 0) {
      // cut styles between shots of one scene: flash cut, whip pan, ink bloom, zoom punch
      const kind = (i * 3 + k) % 4;
      if (kind === 0) {
        tl.set(wrap, { opacity: 0 }, 0); tl.set(wrap, { opacity: 1 }, st);
        const f = document.createElement('div'); f.className = 'flash'; wrap.appendChild(f);
        tl.fromTo(f, { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: 'power2.out' }, st);
      } else if (kind === 1) {
        const prev = shotsBox.children[k - 1];
        tl.fromTo(wrap, { xPercent: 100, filter: 'blur(14px)' }, { xPercent: 0, filter: 'blur(0px)', duration: 0.32, ease: 'power3.out' }, st - 0.12);
        tl.to(prev, { xPercent: -40, filter: 'blur(14px)', duration: 0.32, ease: 'power3.in' }, st - 0.2);
        tl.set(wrap, { xPercent: 100 }, 0);
      } else if (kind === 2) {
        const cx = 30 + ((i * 37 + k * 23) % 40), cy = 35 + ((i * 17) % 30);
        tl.fromTo(wrap, { clipPath: `circle(0% at ${cx}% ${cy}%)` }, { clipPath: `circle(150% at ${cx}% ${cy}%)`, duration: 0.75, ease: 'power2.inOut' }, st - 0.35);
      } else {
        tl.set(wrap, { opacity: 0 }, 0);
        tl.fromTo(wrap, { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'expo.out' }, st - 0.1);
      }
    }
    if (sh.line) {
      // 'being drawn': glowing line art sketches itself in, then colour blooms through it
      const paper = document.createElement('div'); paper.className = 'paper'; wrap.appendChild(paper);
      const ln = document.createElement('div'); ln.className = 'line'; ln.style.backgroundImage = `url("${sh.line}")`; wrap.appendChild(ln);
      tl.fromTo(ln, { clipPath: 'polygon(0% 0%, 0% 0%, -30% 100%, -30% 100%)' }, { clipPath: 'polygon(0% 0%, 130% 0%, 100% 100%, -30% 100%)', duration: 1.1, ease: 'power1.inOut' }, st);
      tl.fromTo(ln, { scale: 1.04 }, { scale: 1.0, duration: 2.0, ease: 'sine.out' }, st);
      const cx = 50, cy = 45;
      tl.fromTo([paper, ln], { clipPath: `circle(150% at ${cx}% ${cy}%)` }, { clipPath: `circle(0% at ${cx}% ${cy}%)`, duration: 0.9, ease: 'power2.in' }, st + 1.25);
      tl.fromTo(b, { filter: 'saturate(0.3) brightness(1.3)' }, { filter: 'saturate(1) brightness(1)', duration: 1.0, ease: 'power2.out' }, st + 1.3);
    }
  });
  // anime speed lines on high-energy moments
  if (s.energy && !s.kind.match(/title|chapter/)) {
    const ns = 'http://www.w3.org/2000/svg';
    const sv = document.createElementNS(ns, 'svg'); sv.setAttribute('viewBox', '-100 -100 200 200'); sv.setAttribute('class', 'speed');
    let paths = '';
    for (let q = 0; q < 70; q++) { const a = (q / 70) * Math.PI * 2 + rnd() * 0.05, w = 0.006 + rnd() * 0.012, r0 = 26 + rnd() * 18;
      paths += `<path d="M${Math.cos(a - w) * r0},${Math.sin(a - w) * r0} L${Math.cos(a) * 140},${Math.sin(a) * 140} L${Math.cos(a + w) * r0},${Math.sin(a + w) * r0}Z" fill="rgba(255,255,255,${0.35 + rnd() * 0.5})"/>`; }
    sv.innerHTML = paths; el.appendChild(sv);
    const sT = t0 + ((shots[0] && shots[0].line) ? Math.min(2.4, d * 0.4) : Math.min(1.2, d * 0.2));
    tl.fromTo(sv, { opacity: 0, scale: 1.25 }, { opacity: 0.55, scale: 1, duration: 0.25, ease: 'power2.out' }, sT);
    for (let q = 0; q < 8; q++) tl.set(sv, { rotation: (q % 2 ? 1.5 : -1.5) }, sT + q * 0.09);
    tl.to(sv, { opacity: 0, scale: 0.92, duration: 0.5, ease: 'power2.in' }, sT + 0.9);
    tl.to(bg, { keyframes: { x: [0, -8, 7, -5, 3, 0] }, duration: 0.4, ease: 'none' }, sT);
  }
  // light leaks: warm amber + teal glow drifting slowly (cinematic anime look)
  const lk1 = document.createElement('div'); lk1.className = 'leak'; lk1.style.background = 'radial-gradient(circle, rgba(255,181,71,.9), rgba(255,120,60,0))';
  const lk2 = document.createElement('div'); lk2.className = 'leak'; lk2.style.background = 'radial-gradient(circle, rgba(63,224,208,.8), rgba(63,224,208,0))';
  el.appendChild(lk1); el.appendChild(lk2);
  tl.fromTo(lk1, { left: '-30%', top: '-30%', opacity: 0 }, { left: '-5%', top: '-15%', opacity: 0.22, duration: d + XF, ease: 'sine.inOut' }, t0 - XF / 2);
  tl.fromTo(lk2, { left: '75%', top: '55%', opacity: 0 }, { left: '60%', top: '40%', opacity: 0.16, duration: d + XF, ease: 'sine.inOut' }, t0 - XF / 2);
  // a few soft light motes drifting upward
  const pc = el.querySelector('.particles');
  for (let k = 0; k < 6; k++) {
    const p = document.createElement('div'); p.className = 'p';
    const sz = (V.width / 1920) * (3 + rnd() * 4);
    p.style.width = p.style.height = sz + 'px';
    p.style.left = (rnd() * 100) + '%'; p.style.top = (30 + rnd() * 70) + '%'; pc.appendChild(p);
    tl.fromTo(p, { y: 0, x: 0, opacity: 0 }, { y: -(40 + rnd() * 120), x: (rnd() - .5) * 60, opacity: 0.25 + rnd() * 0.45, duration: d + XF, ease: 'sine.out' }, t0 - XF / 2);
  }
  // overlays per kind
  if (s.kind === 'title' && s.onscreen) {
    tl.to(dark, { opacity: 0.85, duration: 0.8 }, t0);
    const t = document.createElement('div'); t.className = 'title glass';
    const ws = s.onscreen.split(' ');
    t.innerHTML = '<div class="ring"></div>' + ws.map(w => `<span class="ch${/\d|%|\?/.test(w) ? ' hl' : ''}">${w}</span>`).join(' ');
    el.appendChild(t);
    tl.from(t, { scale: 0.85, opacity: 0, duration: 0.7, ease: 'power3.out' }, t0 + 0.2);
    tl.from(t.querySelector('.ring'), { scale: 0.3, opacity: 0, rotation: -40, duration: 1.1, ease: 'power3.out' }, t0 + 0.3);
    tl.from(t.querySelectorAll('.ch'), { y: 40, opacity: 0, duration: 0.6, stagger: 0.08, ease: 'back.out(1.6)' }, t0 + 0.45);
    tl.to(t.querySelector('.ring'), { rotation: 8, duration: d, ease: 'sine.inOut' }, t0 + 1.4);
    tl.to(t, { opacity: 0, y: -24, duration: 0.5, ease: 'power2.in' }, t0 + d - 0.4);
  } else if (s.kind === 'chapter' && s.onscreen) {
    tl.to(dark, { opacity: 0.8, duration: 0.6 }, t0);
    const hold = Math.min(3.4, d - 0.8);
    tl.to(dark, { opacity: 0, duration: 0.8 }, t0 + hold);
    const m = s.onscreen.match(/^(\d+)\.?\s*(.*)$/);
    const c = document.createElement('div'); c.className = 'chapter glass';
    c.innerHTML = `<div class="no">${m ? m[1] : '•'}<div class="ring"></div></div><div class="txt">${m ? m[2] : s.onscreen}</div>`; el.appendChild(c);
    tl.from(c, { x: -60, opacity: 0, duration: 0.7, ease: 'power3.out' }, t0 + 0.2);
    tl.from(c.querySelector('.no'), { scale: 0, duration: 0.6, ease: 'back.out(2)' }, t0 + 0.35);
    tl.from(c.querySelector('.txt'), { x: -30, opacity: 0, duration: 0.6, ease: 'power3.out' }, t0 + 0.55);
    tl.to(c, { x: 50, opacity: 0, duration: 0.5, ease: 'power2.in' }, t0 + hold);
  } else if (s.kind === 'number' && s.onscreen) {
    tl.to(dark, { opacity: 0.6, duration: 0.5 }, t0 + 0.2);
    const n = document.createElement('div'); n.className = 'num glass';
    n.innerHTML = `<div class="v">${s.onscreen}</div><div class="bar"></div>`; el.appendChild(n);
    tl.from(n, { scale: 0.5, opacity: 0, duration: 0.7, ease: 'back.out(1.8)' }, t0 + 0.4);
    tl.from(n.querySelector('.bar'), { scaleX: 0, duration: 0.9, ease: 'power3.out' }, t0 + 0.8);
    tl.to(n, { y: '-=10', duration: 1.8, yoyo: true, repeat: Math.max(0, Math.floor(d / 1.8) - 2), ease: 'sine.inOut' }, t0 + 1.2);
    tl.to(n, { opacity: 0, scale: 1.08, duration: 0.45, ease: 'power2.in' }, t0 + d - 0.5);
    tl.to(dark, { opacity: 0, duration: 0.45 }, t0 + d - 0.5);
  }
  // info cards: each appears exactly when its key word is spoken
  if (s.labels && s.labels.length) {
    const box = document.createElement('div'); box.className = 'cards'; el.appendChild(box);
    s.labels.forEach((lb) => {
      const c = document.createElement('div'); c.className = 'card glass';
      c.innerHTML = `<span class="dot"></span>${lb.text}`; box.appendChild(c);
      tl.fromTo(c, { y: 30, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.8)' }, lb.t);
      tl.fromTo(c.querySelector('.dot'), { scale: 2.6 }, { scale: 1, duration: 0.45, ease: 'back.out(3)' }, lb.t + 0.05);
    });
    tl.to(box, { opacity: 0, y: 16, duration: 0.4, ease: 'power2.in' }, t0 + d - 0.35);
  }
});

// Shorts: word-by-word captions, 3 words per line group
if (V.captions) {
  const cap = document.createElement('div'); cap.className = 'cap'; stage.appendChild(cap);
  const words = V.captions; const G = 3;
  for (let g = 0; g < words.length; g += G) {
    const grp = words.slice(g, g + G);
    const box = document.createElement('div'); box.style.position = 'absolute'; box.style.left = 0; box.style.right = 0; box.style.bottom = 0;
    box.innerHTML = grp.map(w => `<span class="w${/\d|%/.test(w.w) || w.w.length > 7 ? ' hot' : ''}">${w.w}</span>`).join(' ');
    cap.appendChild(box);
    const spans = box.querySelectorAll('.w');
    grp.forEach((w, k) => tl.fromTo(spans[k], { opacity: 0, y: 25, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: 'back.out(2)' }, w.s));
    const end = (words[g + G] ? words[g + G].s : grp[grp.length - 1].e + 0.4);
    tl.set(box, { opacity: 0 }, end);
  }
}
{ const g = document.createElement('div'); g.className = 'grain'; stage.appendChild(g);
  tl.fromTo(g, { x: 0, y: 0 }, { keyframes: { x: [0, -37, 22, -11, 41, 0], y: [0, 19, -33, 27, -8, 0] }, duration: 0.5, ease: 'steps(6)', repeat: Math.ceil(V.total / 0.5) }, 0); }
if (V.brand) { const b = document.createElement('div'); b.className = 'brand'; b.textContent = V.brand; stage.appendChild(b); }
tl.set({}, {}, V.total);
window.seekTo = (t) => { tl.seek(t, false); return true; };
window.READY = true;
</script>
</body>
</html>
